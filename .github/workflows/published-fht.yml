name: Published FHT authority

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  published-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: owning
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: 623c79fe58edeb238a20fb6de518c62dd69b92bc
          # The immutable binding verifies its schema against the published tag.
          fetch-depth: 0
          persist-credentials: false
          path: shared
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install reference dependencies
        run: python -m pip install 'jsonschema[format]==4.26.0' 'PyYAML==6.0.3'
      - name: Install actual published toolkit wheel (origin and SHA-256 pinned)
        run: |
          python -m venv "$RUNNER_TEMP/published-toolkit"
          "$RUNNER_TEMP/published-toolkit/bin/python" -m pip install \
            'https://files.pythonhosted.org/packages/92/10/a412a877fb8de6e4b28fa4bc5f6f0b65b62701e30d8433afbd5ccfb0629a/fair_bioheaders-0.13.1-py3-none-any.whl#sha256=9f600347711ee771c8bc8f8e545438c255685736206b1342413b16076da20a45'
      - name: Check published authority and actual installed 93 comparisons
        run: python owning/scripts/check_published_fht.py --shared shared --venv "$RUNNER_TEMP/published-toolkit"
      - name: Exercise seven published example round trips and supported commands
        run: python owning/scripts/check_published_fht_surfaces.py --shared shared --venv "$RUNNER_TEMP/published-toolkit"
      - name: State installed-runtime boundary
        run: echo 'Published toolkit 0.13.1 runs normal FHT comparisons; the preserved legacy V7 job is separate. Live alias and downstream publication checks remain separate.' >> "$GITHUB_STEP_SUMMARY"
