name: Published FHT authority

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  published-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: owning
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: 623c79fe58edeb238a20fb6de518c62dd69b92bc
          persist-credentials: false
          path: shared
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install reference dependencies
        run: python -m pip install 'jsonschema[format]==4.26.0' 'PyYAML==6.0.3'
      - name: Check immutable published 93 counterparts and seven example sets
        run: python owning/scripts/check_published_fht.py --shared shared
      - name: State installed-runtime boundary
        run: echo 'Reference authority checked. Installed published-package comparisons are NOT-RUN in this job; the legacy V7 job is separate.' >> "$GITHUB_STEP_SUMMARY"
