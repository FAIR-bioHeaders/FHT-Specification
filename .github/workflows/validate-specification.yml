name: Validate FHT specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Test the generated contract
        run: python -m unittest discover -s tests -v
      - name: Regenerate and reject uncommitted drift
        run: |
          python json-schema-generator.py
          git diff --exit-code fht.json
      - name: Check pinned shared imports
        run: python scripts/check_provenance.py
