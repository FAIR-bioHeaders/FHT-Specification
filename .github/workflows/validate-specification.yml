name: Validate FHT specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-linkml.txt
      - name: Test the generated contract
        run: python -m unittest discover -s tests -v
      - name: Regenerate and reject uncommitted drift
        run: |
          python json-schema-generator.py
          git diff --exit-code fht.json
      - name: Check pinned shared imports
        run: python scripts/check_provenance.py
